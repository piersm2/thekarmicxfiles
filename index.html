<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The KarmicX Files</title>
<meta name="description" content="A fan made tracker for the KXL live show: the Hack Score, every F bomb, the names he drops and how the voice heats up. Updated live.">
<meta property="og:title" content="The KarmicX Files">
<meta property="og:description" content="KarmicX on the record. The Hack Score, every F bomb, updated live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0262d'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='900' font-size='15' text-anchor='middle' fill='white'%3EKX%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #0e0e10; --bar: #141417; --tile: #1a1a1e; --tile2: #222227; --line: #2b2b31;
  --text: #f3f3f5; --dim: #a1a1ab; --faint: #6f6f78;
  --red: #e0262d; --red2: #ff4a50; --redbg: rgba(224, 38, 45, .14);
  --head: "Archivo", "Arial Black", sans-serif; --body: "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--text); font: 15px/1.5 var(--body); }
a { color: var(--text); }
:focus-visible { outline: 2px solid var(--red2); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; }

/* top bar */
header { position: sticky; top: 0; z-index: 20; background: var(--bar); border-bottom: 1px solid var(--line); }
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; min-height: 68px; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.logo i { width: 44px; height: 36px; border-radius: 9px; background: var(--red); display: grid; place-items: center;
  font: 900 17px/1 var(--head); font-style: normal; letter-spacing: -.5px; }
.logo b { font: 800 19px/1.1 var(--head); }
.mid { text-align: center; }
.mid small { display: block; font: 800 12.5px/1 var(--head); letter-spacing: 3px; margin-bottom: 7px; }
.tabs { display: inline-flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.tabs button { all: unset; cursor: pointer; font: 700 11.5px/1 var(--head); letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--dim); padding: 8px 14px; border-radius: 6px; }
.tabs button[aria-selected="true"] { background: var(--tile2); color: var(--text); }
.right { justify-self: end; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font: 600 12.5px/1 var(--body); padding: 7px 11px; border-radius: 7px;
  border: 1px solid var(--line); color: var(--dim); }
.pill.on { border-color: rgba(224, 38, 45, .55); color: var(--red2); background: var(--redbg); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.pill.on .dot { background: var(--red2); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .pill.on .dot { animation: none; } }

main.wrap { padding-top: 22px; padding-bottom: 60px; }
section[hidden] { display: none; }
main > section { scroll-margin-top: 120px; }
.grid { display: grid; gap: 16px; }
.tile { background: var(--tile); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.tile h3 { font: 800 13px/1 var(--head); letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin: 0 0 14px; }
.badge { display: inline-flex; align-items: center; gap: 6px; background: var(--red); color: #fff; font: 800 12px/1 var(--head);
  letter-spacing: 1px; padding: 6px 9px; border-radius: 6px; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
.badge.off { background: rgba(0,0,0,.6); border: 1px solid var(--line); }
.badge.off::before { display: none; }

/* scorecard tab */
.hero { grid-template-columns: 1.1fr 1.4fr; }
.rating { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
.rating .num { font: 900 112px/.85 var(--head); letter-spacing: -4px; font-variant-numeric: tabular-nums; }
.rating .lbl { font: 800 26px/1.1 var(--head); }
.rating p { color: var(--dim); margin: 8px 0 0; }
.letters { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.letters span { font: 800 13px/1 var(--head); padding: 6px 8px; border-radius: 6px; background: var(--tile2); color: var(--dim); }
.letters span.hot { background: var(--redbg); color: var(--red2); }
.latest { display: grid; grid-template-columns: 1fr auto; gap: 14px; }
.latest .t { font: 800 22px/1.15 var(--head); margin: 8px 0 4px; }
.latest .s { color: var(--dim); }
.bigf { text-align: right; }
.bigf b { display: block; font: 900 64px/.9 var(--head); color: var(--red2); font-variant-numeric: tabular-nums; }
.bigf span { color: var(--dim); font-size: 13px; }
.stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat b { display: block; font: 800 34px/1 var(--head); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.stat span { color: var(--dim); font-size: 13.5px; }
.bars { display: grid; grid-template-columns: 210px 1fr 44px; gap: 12px 14px; align-items: center; }
.bars .tr { height: 10px; background: var(--tile2); border-radius: 5px; overflow: hidden; }
.bars .fl { height: 100%; background: var(--red); border-radius: 5px; }
.bars .v { font: 800 18px/1 var(--head); text-align: right; font-variant-numeric: tabular-nums; }
.bars .d { grid-column: 1 / -1; color: var(--faint); font-size: 12.5px; margin: -9px 0 0; }
.note { color: var(--faint); font-size: 12.5px; margin: 14px 0 0; }
/* trading card */
.tcard { background: var(--tile); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.tc-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 22px;
  background: radial-gradient(120% 140% at 0% 0%, #3a1214 0%, #1a1a1e 60%); border-bottom: 2px solid var(--red); }
.tc-id { display: flex; align-items: center; gap: 14px; min-width: 0; }
.tc-id i { width: 58px; height: 58px; border-radius: 12px; background: var(--red); display: grid; place-items: center; font: 900 22px/1 var(--head); font-style: normal; flex: none; }
.tc-id b { display: block; font: 900 30px/1 var(--head); letter-spacing: -.5px; }
.tc-id small { display: block; color: var(--dim); margin-top: 6px; font-size: 13.5px; }
.tc-hack { text-align: right; flex: none; }
.tc-hack small { display: block; font: 800 11.5px/1 var(--head); letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); }
.tc-hack b { display: block; font: 900 84px/.9 var(--head); letter-spacing: -3px; font-variant-numeric: tabular-nums; margin-top: 4px; }
.tc-hack span { font: 800 16px/1.1 var(--head); color: var(--red2); }
.tc-read { padding: 18px 22px; font-size: 17px; line-height: 1.5; border-bottom: 1px solid var(--line); }
.tc-read small { display: block; color: var(--faint); font-size: 12.5px; margin-top: 6px; }
.tc-body { display: grid; grid-template-columns: 1fr 1fr; }
.tc-body > div { padding: 18px 22px; }
.tc-body > div + div { border-left: 1px solid var(--line); }
.tcard h3 { font: 800 12.5px/1 var(--head); letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin: 0 0 14px; }
.bars.sm { grid-template-columns: 130px 1fr 36px; gap: 9px 12px; }
.bars.sm .v { font-size: 15px; }
.bars.sm .tr { height: 8px; }
.bars.sm .fl.p { background: var(--dim); }
.mood { display: flex; height: 14px; border-radius: 5px; overflow: hidden; gap: 2px; }
.mood i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--dim); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.m-Heated { background: var(--red2); } .m-Laughing { background: #3987e5; } .m-Chill { background: #199e70; } .m-Flat { background: var(--faint); } .m-Off { background: #3a3a42; }
.tc-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 22px; padding: 18px 22px; border-top: 1px solid var(--line); }
.chipr { display: flex; flex-wrap: wrap; gap: 6px; }
.chipr span { font: 600 13px/1 var(--body); background: var(--tile2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
.chipr span b { color: var(--dim); margin-left: 4px; font-weight: 700; }
.chipr.hot span { border-color: rgba(224, 38, 45, .5); }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.tl { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 1px; margin-top: 4px; }
.tl i { display: block; height: 100%; min-width: 3px; }

/* streams tab */
.cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { all: unset; cursor: pointer; display: block; background: var(--tile); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card:hover { border-color: #44444c; }
.thumb { position: relative; aspect-ratio: 16 / 9; display: grid; place-items: center;
  background: radial-gradient(120% 90% at 20% 0%, #3a1214 0%, #17171b 55%, #101013 100%); border-bottom: 2px solid var(--red); }
.thumb .f { text-align: center; }
.thumb .f b { display: block; font: 900 74px/.9 var(--head); letter-spacing: -2px; }
.thumb .f span { font: 800 13px/1 var(--head); letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }
.thumb .badge { position: absolute; top: 12px; left: 12px; }
.thumb .hk { position: absolute; top: 12px; right: 12px; font: 800 12px/1 var(--head); background: rgba(0,0,0,.65); border: 1px solid var(--line);
  padding: 6px 8px; border-radius: 6px; letter-spacing: .5px; }
.thumb .len { position: absolute; bottom: 10px; right: 12px; font: 600 12px/1 var(--body); background: rgba(0,0,0,.75); padding: 5px 7px; border-radius: 5px; }
.meta { padding: 12px 14px 14px; }
.meta .t { font: 700 15.5px/1.3 var(--body); }
.meta .s { color: var(--dim); font-size: 13px; margin-top: 3px; }

/* leaderboard */
.boards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lb { list-style: none; margin: 0; padding: 0; counter-reset: r; }
.lb li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.lb li::before { counter-increment: r; content: counter(r); font: 800 14px/1 var(--head); color: var(--faint); }
.lb li:first-child::before { color: var(--red2); }
.lb b { font: 800 17px/1 var(--head); font-variant-numeric: tabular-nums; }
.lb small { display: block; color: var(--faint); font-size: 12.5px; }
.q { padding: 10px 0; border-bottom: 1px solid var(--line); }
.q span { display: block; font: 700 12.5px/1.2 var(--body); color: var(--red2); margin-bottom: 4px; }

/* the file */
.file2 { grid-template-columns: 1.4fr 1fr; align-items: start; }
.prose { white-space: pre-wrap; color: #dcdce2; max-width: 72ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { background: var(--tile2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th { text-align: right; color: var(--faint); font-weight: 600; padding: 6px 6px; border-bottom: 1px solid var(--line); }
td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
.news { list-style: none; margin: 0; padding: 0; }
.news li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.news .d { color: var(--red2); font: 700 12.5px/1 var(--body); margin-right: 8px; }
.news small { display: block; color: var(--faint); margin-top: 3px; }
.empty { color: var(--dim); }

/* case file overlay */
dialog { width: min(980px, calc(100% - 24px)); max-height: calc(100% - 40px); background: var(--tile); color: var(--text);
  border: 1px solid var(--line); border-radius: 14px; padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.72); }
.dhead { position: sticky; top: 0; background: var(--tile); display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 16px 20px; border-bottom: 1px solid var(--line); }
.dhead b { font: 800 19px/1.2 var(--head); }
.dhead button { all: unset; cursor: pointer; font: 700 13px/1 var(--body); padding: 8px 12px; border-radius: 7px; background: var(--tile2); }
.dbody { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.dbody h4 { font: 800 13px/1 var(--head); letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; }
.wide { grid-column: 1 / -1; }
.times { color: var(--faint); font-size: 12px; }
.tl { list-style: none; margin: 0; padding: 0; columns: 2 260px; column-gap: 24px; }
.tl li { break-inside: avoid; display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.tl li b { font: 800 15px/1.2 var(--head); }
.session { white-space: pre-wrap; color: #dcdce2; font-size: 14.5px; }

footer { color: var(--faint); font-size: 12px; padding: 8px 0 28px; }
footer p { margin: 0 0 6px; max-width: 80ch; }

@media (max-width: 980px) {
  .bar { grid-template-columns: 1fr auto; }
  .mid { grid-column: 1 / -1; grid-row: 2; padding-bottom: 12px; overflow-x: auto; }
  .mid small { display: none; }
  .hero, .file2, .boards { grid-template-columns: 1fr; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tc-chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tc-body { grid-template-columns: 1fr; } .tc-body > div + div { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .logo b { font-size: 16px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards { grid-template-columns: 1fr; }
  .rating .num { font-size: 88px; }
  .tc-head { padding: 16px; } .tc-id i { width: 46px; height: 46px; font-size: 18px; } .tc-id b { font-size: 24px; }
  .tc-hack b { font-size: 64px; } .tc-read, .tc-body > div, .tc-chips { padding-left: 16px; padding-right: 16px; }
  .tc-chips { grid-template-columns: 1fr; } .bars.sm { grid-template-columns: 112px 1fr 32px; }
  .pgrid { grid-template-columns: 1fr; }
  .bars { grid-template-columns: 130px 1fr 36px; }
  .dbody { grid-template-columns: 1fr; }
  .tabs { width: 100%; justify-content: space-between; }
  .tabs button { padding: 8px 7px; letter-spacing: .3px; font-size: 11px; }
}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="#scorecard"><i>KX</i><b>The KarmicX Files</b></a>
  <div class="mid">
    <small>KARMICX, ON THE RECORD</small>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="scorecard" aria-selected="true">Scorecard</button>
      <button role="tab" data-tab="streams">Streams</button>
      <button role="tab" data-tab="leaderboard">Leaderboard</button>
      <button role="tab" data-tab="file">The file</button>
    </div>
  </div>
  <div class="right"><span class="pill" id="air"><span class="dot"></span><span id="airText">Checking</span></span></div>
</div></header>

<main class="wrap">
  <section id="scorecard"></section>
  <section id="streams" hidden></section>
  <section id="leaderboard" hidden></section>
  <section id="file" hidden></section>
</main>

<dialog id="case"><div class="dhead"><b id="caseTitle"></b><button onclick="document.getElementById('case').close()">Close</button></div><div class="dbody" id="caseBody"></div></dialog>

<footer><div class="wrap"><p>Fan made. Not affiliated with KarmicX.</p></div></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = n => String(n).replace(/\s*\([^)]*\)$/, "");
const minus = v => String(v).replace("-", "−");
const LETTER = { recycled: "R", drama: "D", begging: "B", filler: "F" };
const partsOf = x => (x.parts && x.parts.length) ? x.parts : [];
const TALLY = { swearing: "Swearing", begging: "Begging", chat: "Reading chat", catchphrases: "Repeat bits", mocking: "Voices and characters", people: "Dabbleverse names" };
const KIND = { character: "His character", clip: "Clip or video", guest: "Guest" };
let D = null;

function fmtT(sec) { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`; }
function dur(s) { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; }
function verdict(h) { return h == null ? "Not rated yet" : h < 20 ? "Legit, for now" : h < 40 ? "Mostly legit" : h < 60 ? "Kind of a hack" : h < 80 ? "Hack" : "Total hack"; }

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
window.addEventListener("hashchange", () => show(location.hash.slice(1) || "scorecard", true));
function show(tab, fromHash) {
  if (!["scorecard", "streams", "leaderboard", "file"].includes(tab)) tab = "scorecard";
  document.querySelectorAll("main > section").forEach(s => s.hidden = s.id !== tab);
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  if (!fromHash) history.replaceState(null, "", "#" + tab);
  window.scrollTo(0, 0);
}

async function load() {
  try { D = await (await fetch("data.json?v=" + Date.now())).json(); }
  catch { $("#scorecard").innerHTML = `<p class="empty">The file did not load. Refresh in a minute.</p>`; return; }
  const live = D.streams.find(s => s.status === "live");
  $("#air").classList.toggle("on", !!live);
  $("#airText").textContent = live ? "Live now" : D.streams.length ? `Off air since ${D.streams[0].date.replace(/, \d{4}$/, "")}` : "Off air";
  scorecard(live); streams(); leaderboard(); file();
  show(location.hash.slice(1) || "scorecard", true);
}

const MOOD = ["Heated", "Laughing", "Chill", "Flat", "Off mic"];
const mcls = m => "m-" + String(m).split(" ")[0];
function moodBar(mix) {
  const items = MOOD.filter(m => mix && mix[m]);
  if (!items.length) return `<p class="note" style="margin:0">Shows up after some talking.</p>`;
  return `<div class="mood">${items.map(m => `<i class="${mcls(m)}" style="flex:${mix[m]}" title="${m} ${mix[m]}%"></i>`).join("")}</div>
    <div class="legend">${items.map(m => `<span><i class="${mcls(m)}"></i>${m} ${mix[m]}%</span>`).join("")}</div>`;
}
function traitBars(traits) {
  return `<div class="bars sm">${(traits || []).map(t => `<div title="${esc(t.raw == null ? "Not enough yet" : t.raw + " " + t.unit)}">${esc(t.name)}</div>
    <div class="tr"><div class="fl p" style="width:${t.score || 0}%"></div></div><div class="v">${t.score ?? "n/a"}</div>`).join("")}</div>`;
}
function chipr(rows, fmt, none, hot) { return rows && rows.length ? `<div class="chipr${hot ? " hot" : ""}">${rows.map(fmt).join("")}</div>` : `<p class="note" style="margin:0">${none}</p>`; }

function scorecard(live) {
  const c = D.career, s = live || D.streams[0], K = D.card || { traits: [], obsessions: [], goes_after: [], talks_up: [], triggers: [] };
  const P = partsOf(c);
  $("#scorecard").innerHTML = `
  <div class="tcard">
    <div class="tc-head"><div class="tc-id"><i>KX</i><div><b>KarmicX</b><small>KXL. ${c.streams} stream${c.streams === 1 ? "" : "s"} on file, ${dur(c.listened_s)} of tape.</small></div></div>
      <div class="tc-hack"><small>Hack rating</small><b>${c.hack ?? "NR"}</b><span>${esc(verdict(c.hack))}</span></div></div>
    <div class="tc-read">${K.read ? esc(K.read) : "The read shows up after his first full stream."}
      <small>${K.read_by === "claude" ? "Claude's read, sharpened after every stream." : "Read from the numbers."} Measured from what he says and how he sounds on air. Not a diagnosis.</small></div>
    <div class="tc-body">
      <div><h3>Personality on air</h3>${traitBars(K.traits)}</div>
      <div><h3>What makes a hack</h3><div class="bars sm">${P.map(x => `<div>${esc(x.name)}</div><div class="tr"><div class="fl" style="width:${x.score || 0}%"></div></div><div class="v">${x.score ?? "n/a"}</div>`).join("")}</div>
        <h3 style="margin-top:20px">Moods</h3>${moodBar(K.mood_mix)}</div></div>
    <div class="tc-chips">
      <div><h3>Obsessions</h3>${chipr(K.obsessions.slice(0, 6), o => `<span>${esc(o[0])}<b>${o[1]}</b></span>`, "Needs more streams.")}</div>
      <div><h3>Goes after</h3>${chipr(K.goes_after, f => `<span title="${f.hostile} hostile of ${f.mentions} mentions">${esc(short(f.name))}<b>${f.hostile}</b></span>`, "Nobody yet.", true)}</div>
      <div><h3>Talks up</h3>${chipr(K.talks_up, f => `<span title="${f.warm} warm of ${f.mentions} mentions">${esc(short(f.name))}<b>${f.warm}</b></span>`, "Nobody yet.")}</div>
      <div><h3>Gets heated about</h3>${chipr(K.triggers, t => `<span>${esc(short(t[0]))}<b>${t[1]}</b></span>`, "Nothing clear yet.")}</div>
    </div>
  </div>
  ${s ? `<div class="tile" style="margin-top:16px"><h3>${live ? "On air now" : "Latest stream"}</h3>
      <div class="latest"><div>${live ? '<span class="badge">LIVE</span>' : `<span class="badge off">${esc(s.weekday)} ${esc(s.start_clock)}</span>`}
        <div class="t">${esc(s.title)}</div>
        <div class="s">${esc(s.show_type)}, ${dur(s.listened_s)}${s.viewers_avg != null ? `, about ${s.viewers_avg} watching` : ""}. Hack ${s.hack ?? "n/a"}, ${esc(s.label.toLowerCase())}.</div>
        ${s.persona && s.persona.read ? `<div class="s" style="margin-top:10px;color:var(--text)">${esc(s.persona.read)}</div>` : ""}
        <div style="margin-top:14px"><button class="badge off" style="cursor:pointer;border:1px solid var(--line)" onclick="openCase('${esc(s.id)}')">Open the case file</button></div></div>
        <div class="bigf"><b>${s.f}</b><span>F bombs<br>${s.pct}% of his words</span></div></div></div>` : `<div class="tile empty" style="margin-top:16px">No streams on file yet.</div>`}
  <div class="grid stats" style="margin-top:16px">
    <div class="tile stat"><b>${c.f.toLocaleString()}</b><span>F bombs on file</span></div>
    <div class="tile stat"><b>${c.pct}%</b><span>of everything he says</span></div>
    <div class="tile stat"><b>${c.swears.toLocaleString()}</b><span>swears in total</span></div>
    <div class="tile stat"><b>${c.words.toLocaleString()}</b><span>words on the record</span></div>
  </div>
  <div class="tile" style="margin-top:16px"><h3>Every habit counted</h3><div class="bars">
    ${c.cats.map(x => `<div>${esc(x.name)}</div><div class="tr"><div class="fl" style="width:${x.score || 0}%"></div></div><div class="v">${x.score ?? "n/a"}</div>`).join("")}
  </div><p class="note">The Hack rating weighs four things: recycled material, drama farming, begging, and filler and cheap shock, each compared with the other shows tracked. The worst habit counts extra.</p></div>`;
}

function streams() {
  $("#streams").innerHTML = D.streams.length ? `<div class="grid cards">${D.streams.map(s => `
    <button class="card" onclick="openCase('${esc(s.id)}')" aria-label="Open ${esc(s.title)}">
      <div class="thumb">${s.status === "live" ? '<span class="badge">LIVE</span>' : `<span class="badge off">${esc(s.date.replace(/, \d{4}$/, ""))}</span>`}
        <span class="hk">HACK ${s.hack ?? "NR"}</span>
        <div class="f"><b>${s.f}</b><span>F bombs</span></div><span class="len">${dur(s.listened_s)}</span></div>
      <div class="meta"><div class="t">${esc(s.title)}</div>
        <div class="s">${esc(s.weekday)} ${esc(s.start_clock)}. ${esc(s.show_type)}. ${s.pct}% of his words.</div></div>
    </button>`).join("")}</div>` : `<p class="empty">No streams on file yet.</p>`;
}

function board(title, rows, fmt) {
  return `<div class="tile"><h3>${title}</h3>${rows.length ? `<ol class="lb">${rows.map(fmt).join("")}</ol>` : `<p class="empty">Nothing yet.</p>`}</div>`;
}
function leaderboard() {
  const L = D.leaders;
  $("#leaderboard").innerHTML = `<div class="grid boards">
    ${board("Names he drops", L.people, ([n, c]) => `<li><span>${esc(short(n))}</span><b>${c}</b></li>`)}
    ${board("His go to swears", L.swears, ([w, c]) => `<li><span>${esc(w)}</span><b>${c}</b></li>`)}
    ${board("Biggest F bomb streams", L.streams_by_f, ([id, t, d, f, p]) => `<li><span><a href="#streams" onclick="openCase('${esc(id)}');return false">${esc(t)}</a><small>${esc(d)}, ${p}% of his words</small></span><b>${f}</b></li>`)}
    <div class="tile"><h3>Hottest moments</h3>${L.hottest.length ? L.hottest.map(h => `<div class="q"><span>Anger ${h.anger}, ${esc(h.date)}, ${h.at} in</span>"${esc(h.quote)}"</div>`).join("") : `<p class="empty">Nothing yet.</p>`}</div>
    ${L.cast.length ? board("The cast: characters, clips and guests", L.cast, ([n, k, s]) => `<li><span>${esc(n)}<small>${esc(KIND[k] || k)}</small></span><b>${dur(s)}</b></li>`) : ""}
  </div>`;
}

function file() {
  const P = D.profile, pt = P.patterns;
  const tbl = (title, rows) => rows.length ? `<h3 style="margin-top:18px">${title}</h3><table><thead><tr><th></th><th>Streams</th><th>Hack</th><th>Anger</th><th>Swearing</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(r.group)}</td><td>${r.streams}</td><td>${r.hack ?? "n/a"}</td><td>${r.anger ?? "n/a"}</td><td>${r.swearing != null ? r.swearing + "%" : "n/a"}</td></tr>`).join("")}</tbody></table>` : "";
  $("#file").innerHTML = `<div class="grid file2">
    <div class="tile"><h3>What we know about him</h3>${P.ai ? `<div class="prose">${esc(P.ai)}</div>` : `<p class="empty">The profile fills in as streams come in.</p>`}
      ${P.catchphrases.length ? `<h3 style="margin-top:20px">Repeat bits</h3><div class="chips">${P.catchphrases.map(p => `<span>"${esc(p[0])}" ${p[1]}</span>`).join("")}</div>` : ""}</div>
    <div class="grid">
      <div class="tile"><h3>When he streams</h3>${pt.streams >= 2 ? tbl("Time of day", pt.daypart) + tbl("Show type", pt.show_type) : `<p class="empty">Shows up after a few streams.</p>`}</div>
      <div class="tile"><h3>In the Dabbleverse news</h3>${D.news.length ? `<ul class="news">${D.news.map(n => `<li><span class="d">${esc(n.date)}</span><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
        <small>${n.about_him ? "About him." : ""}${n.he_said.length ? ` He talked about ${esc(n.he_said.join(", "))} that week.` : ""}</small></li>`).join("")}</ul>` : `<p class="empty">Nothing linked yet.</p>`}</div>
    </div></div>`;
}

function openCase(id) {
  const s = D.streams.find(x => x.id === id); if (!s) return;
  $("#caseTitle").textContent = `${s.title}, ${s.weekday} ${s.start_clock}`;
  const bars = partsOf(s).map(c => `<div>${esc(c.name)}</div><div class="tr"><div class="fl" style="width:${c.score || 0}%"></div></div><div class="v">${c.score ?? "n/a"}</div>
    <div class="d">${c.score != null ? esc(c.signals.map(x => `${x[1]} ${x[2]}`).join(", ")) + (c.why ? `. ${esc(c.why)}` : "") : "Still learning this one"}</div>`).join("");
  const tally = Object.entries(TALLY).map(([k, n]) => (s.tally[k] || []).length ? `<div class="wide"><h4>${n}</h4><ul class="tl">${s.tally[k].map(([w, c, ts]) =>
    `<li><span>${esc(short(w))}<br><span class="times">${ts.slice(0, 8).map(fmtT).join(", ")}${ts.length > 8 ? " and more" : ""}</span></span><b>${c}</b></li>`).join("")}</ul></div>` : "").join("");
  const voices = (s.voices || []).filter(v => v.kind !== "host");
  $("#caseBody").innerHTML = `
    <div><h4>Hack rating ${s.hack ?? "n/a"}</h4>${s.verdict ? `<p>${esc(s.verdict)}</p>` : ""}<div class="bars">${bars}</div>
      ${(s.recycled || []).length ? `<h4 style="margin-top:18px">Heard it before</h4>${s.recycled.slice(0, 6).map(([t, q]) => `<div class="q"><span>${t} in</span>"${esc(q)}"</div>`).join("")}` : ""}</div>
    ${s.persona && s.persona.traits && s.persona.traits.some(t => t.score != null) ? `<div class="wide"><h4>Personality this stream</h4>
      ${s.persona.read ? `<p>${esc(s.persona.read)}</p>` : ""}
      <div class="pgrid">${traitBars(s.persona.traits)}
        <div>${s.persona.mood.length ? `<div class="tl">${s.persona.mood.map(([a, b, m]) => `<i class="${mcls(m)}" style="flex:${b - a}" title="${m}, ${fmtT(a)} to ${fmtT(b)}"></i>`).join("")}</div>` : ""}${moodBar(s.persona.mix)}
        ${s.persona.feuds.length ? `<p style="margin-top:12px">Talked about ${s.persona.feuds.map(f => `${esc(short(f.name))} (${f.mentions}${f.hostile ? `, ${f.hostile} hostile` : ""})`).join(", ")}.</p>` : ""}</div></div></div>` : ""}
    <div><h4>The F word</h4><p>${s.f} F bombs and ${s.swears} swears in ${s.words.toLocaleString()} of his words${s.per_hour ? `, about ${s.per_hour} F bombs an hour of talking` : ""}.</p>
      ${s.r != null ? `<p>F word and anger: ${esc(s.link.toLowerCase())} (r = ${minus(s.r.toFixed(2))}).${s.anger_with_f != null ? ` His voice read ${s.anger_with_f} out of 100 around an F bomb and ${s.anger_without_f} the rest of the time.` : ""}</p>` : ""}
      ${voices.length ? `<h4 style="margin-top:18px">Who else was on</h4><p>${voices.map(v => `${esc(v.name)} (${esc(KIND[v.kind] || v.kind)}, ${dur(v.secs)})`).join(", ")}</p>` : ""}
      <h4 style="margin-top:18px">Rundown</h4>${s.rundown.map(([a, b, k, n]) => `<div>${fmtT(a)} to ${fmtT(b)}: ${esc(n)}</div>`).join("")}</div>
    ${s.flashpoints.length ? `<div class="wide"><h4>Flashpoints</h4>${s.flashpoints.map(p => `<div class="q"><span>${p.at} in, anger ${p.anger}</span>"${esc(p.quote)}"</div>`).join("")}</div>` : ""}
    ${tally}
    ${s.session ? `<div class="wide"><h4>${s.session_by === "claude" ? "Therapy session" : "Session notes"}</h4><div class="session">${esc(s.session)}</div></div>` : ""}`;
  $("#case").showModal();
}

load();
setInterval(() => { if (!$("#case").open) load(); }, 60000);
</script>
</body>
</html>
